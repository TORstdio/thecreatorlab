# Cada push a main construye el sitio y lo sube a Cloudflare Pages.
# Cloudflare no se conecta a GitHub: GitHub sube el build con un token de API.
#
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN              token con permiso "Account · Cloudflare Pages · Edit"
#   CLOUDFLARE_ACCOUNT_ID             ID de la cuenta de Cloudflare
#   NEXT_PUBLIC_HOTMART_CHECKOUT_URL  link de checkout de Hotmart (mismo que .env.local)

name: Deploy a Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_NAME: thecreatorlab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Wrangler pide Node 22+; Next 16 funciona igual con esta versión.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (export estático en out/)
        run: npm run build
        env:
          NEXT_PUBLIC_HOTMART_CHECKOUT_URL: ${{ secrets.NEXT_PUBLIC_HOTMART_CHECKOUT_URL }}

      - name: Publicar en Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Crea el proyecto la primera vez; si ya existe, sigue.
          npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch=main || true
          npx --yes wrangler@4 pages deploy out --project-name="$PROJECT_NAME" --branch=main
